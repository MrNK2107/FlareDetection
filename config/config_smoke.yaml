data:
  raw_dir: "data/raw_smoke"
  processed_dir: "data/processed_smoke"
  windows_dir: "data/windows_smoke"
  external_dir: "data/external_smoke"

ingestion:
  target_frequency_hz: 1.0
  gap_threshold_s: 5
  z_score_window_h: 6
  window_length_s: 1200
  window_stride_s: 10
  forecast_horizon_s: 1800
  feature_stride_s: 60
  dl_window_stride_s: 120
  dl_internal_cadence_s: 10
  dl_dtype: float32

synthetic_data:
  total_days: 3
  seed: 42
  chunk_days: 15
  min_gap_s: 900
  quiet_baseline_soft: 1.0e-7
  quiet_baseline_hard: 1.0e-8
  noise_std_soft: 1.0e-9
  noise_std_hard: 1.0e-10
  dropout_prob: 0.001
  events_per_day:
    B: 2.0
    C: 1.5
    M: 1.0
    X: 0.5

features:
  layers: [L1, L2, L3, L4, L5]
  rolling_windows_s: [60, 300]
  batch_size: 2000

models:
  random_forest:
    n_estimators: 50
    max_depth: 12
    class_weight: "balanced"
  logistic_regression:
    class_weight: "balanced"
    max_iter: 500
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    epochs: 2
    batch_size: 128
    lr: 0.002
    max_train_windows: 20000
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 1
    conv_kernels: [3, 7, 15]
    fusion_dim: 128
    dropout: 0.1
    epochs: 2
    batch_size: 64
    lr: 0.001
    focal_gamma: 2.0
    focal_alpha: 0.75
    loss_weights: [0.5, 0.3, 0.2]
    mc_dropout_samples: 10
    max_train_windows: 20000
  hmm:
    n_states: 6
    n_iter: 30
    n_init: 2

evaluation:
  test_days: 0.5
  quiet_subsample_ratio: 4
  tss_threshold: 0.6
  brier_threshold: 0.08
  false_alarm_threshold: 0.25
  detection_rate_threshold: 0.8
  lead_time_mae_threshold_min: 5.0

alerting:
  threshold: 0.5
  quiet_window_minutes: 15
  channels:
    email:
      enabled: false
    webhook:
      enabled: false
    browser:
      enabled: true
