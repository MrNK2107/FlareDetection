services:
  - type: web
    name: flare-classifier-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

  - type: static
    name: flare-classifier-dashboard
    env: static
    buildCommand: cd src/dashboard && npm install && npm run build
    staticPublishPath: src/dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://flare-classifier-api.onrender.com
